name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup default 1.94.1
      - run: python scripts/fetch_sources.py --upstream-only
      - run: python scripts/validate.py --check-sources --check-rust
      - run: python -m unittest discover -s tests -v
      - run: python scripts/summarize_results.py evals/results/2026-10-23
      - run: python scripts/summarize_integration.py evals/results/rhwp-2026-10-23
      - run: python scripts/package_skill.py
  replay-rhwp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.93.1 --profile minimal --component clippy --component rustfmt
      - run: python scripts/rhwp_eval.py fetch
      - run: python scripts/replay_integration.py --output .cache/rhwp-replay --fetch-dependencies
